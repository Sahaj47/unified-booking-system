{% extends "base.html" %}
{% block title %}Book a Resource{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">

    <h4 class="fw-bold mb-3">Book a Campus Resource</h4>

    {% if message %}
    <div class="alert alert-success">✅ {{ message }}</div>
    {% endif %}

    {% if error %}
    <div class="alert alert-danger">❌ {{ error }}</div>
    {% endif %}

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('book') }}"
              id="bookForm" novalidate>

          <div class="mb-3">
            <label class="form-label fw-semibold">Resource</label>
            <select class="form-select" name="resource_id" id="resourceSelect" required>
              <option value="">— Select a resource —</option>
              {% for r in resources %}
              <option value="{{ r.resource_id }}"
                      data-approval="{{ r.requires_approval }}">
                {{ r.name }} (capacity: {{ r.capacity }})
                {% if r.requires_approval %}⚠ Needs approval{% endif %}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Time Slot</label>
            <select class="form-select" name="slot_id" required>
              <option value="">— Select a slot —</option>
              {% for s in slots %}
              <option value="{{ s.slot_id }}">
                {{ s.label }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Date</label>
            <input type="date" class="form-control" name="booking_date"
                   id="bookingDate" required>
          </div>

          <div id="approvalNote" class="alert alert-warning d-none py-2 small">
            ⚠ This resource requires admin approval before it is confirmed.
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Submit Booking
          </button>
        </form>
      </div>
    </div>

  </div>
</div>

<script>
/* Set minimum date to today */
document.getElementById('bookingDate').min =
    new Date().toISOString().split('T')[0];

/* Show approval warning when a restricted resource is selected */
document.getElementById('resourceSelect').addEventListener('change', function() {
  const selected = this.options[this.selectedIndex];
  const note     = document.getElementById('approvalNote');
  note.classList.toggle('d-none', selected.dataset.approval !== '1');
});

/* Basic validation */
document.getElementById('bookForm').addEventListener('submit', function(e) {
  const resource = document.querySelector('[name="resource_id"]').value;
  const slot     = document.querySelector('[name="slot_id"]').value;
  const date     = document.querySelector('[name="booking_date"]').value;
  if (!resource || !slot || !date) {
    e.preventDefault();
    alert('Please fill in all fields before submitting.');
  }
});
</script>
{% endblock %}
